name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compile evaluation and execution modules
        run: |
          python -m py_compile \
            a2a_simple/__main__.py \
            a2a_simple/router_agent.py \
            a2a_simple/agent_resilience.py \
            a2a_simple/telemetry.py \
            a2a_simple/execution_sandbox.py \
            a2a_simple/code_execution_agent.py \
            a2a_simple/routing_policy.py \
            a2a_simple/evals/evaluate_router.py \
            a2a_simple/evals/evaluate_robustness.py \
            a2a_simple/evals/evaluate_execution.py \
            a2a_simple/test_execution_evaluation.py \
            a2a_simple/test_agent_resilience.py \
            a2a_simple/test_telemetry.py \
            a2a_simple/test_router_robustness.py

      - name: Test per-route timeout and circuit-breaker behavior
        env:
          PYTHONPATH: a2a_simple
        run: python -m unittest a2a_simple.test_agent_resilience -v

      - name: Test content-safe agent telemetry
        env:
          PYTHONPATH: a2a_simple
        run: python -m unittest a2a_simple.test_telemetry -v

      - name: Run constrained execution tests
        run: |
          python -m unittest discover \
            -s a2a_simple \
            -p 'test_execution*.py' \
            -v

      - name: Enforce execution reliability gates
        env:
          PYTHONPATH: a2a_simple
        run: |
          python -m evals.evaluate_execution \
            --dataset a2a_simple/evals/execution_scenarios.jsonl \
            --check a2a_simple/evals/results/execution_reliability_v1.json

      - name: Enforce routing and safety regression gates
        env:
          PYTHONPATH: a2a_simple
        run: |
          python -m evals.evaluate_router \
            --dataset a2a_simple/evals/scenarios.jsonl \
            --check a2a_simple/evals/results/router_eval_v1.json

      - name: Test router robustness under prompt perturbations
        env:
          PYTHONPATH: a2a_simple
        run: |
          python -m unittest a2a_simple.test_router_robustness -v
          python -m evals.evaluate_robustness \
            --dataset a2a_simple/evals/scenarios.jsonl \
            --check a2a_simple/evals/results/router_robustness_v1.json
