name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compile evaluation and execution modules
        run: |
          python -m py_compile \
            a2a_simple/execution_sandbox.py \
            a2a_simple/code_execution_agent.py \
            a2a_simple/routing_policy.py \
            a2a_simple/evals/evaluate_router.py

      - name: Run constrained execution tests
        run: |
          python -m unittest discover \
            -s a2a_simple \
            -p 'test_execution_sandbox.py' \
            -v

      - name: Enforce routing and safety regression gates
        env:
          PYTHONPATH: a2a_simple
        run: |
          python -m evals.evaluate_router \
            --dataset a2a_simple/evals/scenarios.jsonl \
            --check a2a_simple/evals/results/router_eval_v1.json
